name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run button for when GitHub's hosted runners are slow to pick
  # up webhook-triggered runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        # `lfs: true` fetches every LFS object (~59k files, the whole authoring
        # library) on every run and blew past the job timeout. CI only needs
        # the runtime assets below, so fetch those explicitly.
      - name: Fetch required LFS assets
        run: |
          git lfs install --local
          git lfs pull --include "public/**,docs/Assets/Previews/**,SourceAssets/Models/Environment/Working/Japanese_Forest_Shrine_Realistic.blend,SourceAssets/Models/Environment/External/Zgon/Komainu_Statue/komainu_statue_1k.glb"
      - uses: actions/setup-node@v7
        with:
          # Vite 8 requires Node 20.19+; 22 is the current LTS.
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check no build-only packages in production deps
        run: |
          node -e "
            const p = require('./package.json');
            const buildOnly = ['@gltf-transform/cli', '@gltf-transform/core'];
            const prod = Object.keys(p.dependencies || {});
            const found = buildOnly.filter(b => prod.includes(b));
            if (found.length) {
              console.error('::error::Build-only packages in dependencies (move to devDependencies):', found.join(', '));
              process.exit(1);
            }
          "
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # The simulation — lift, doors, collision, shaft interlocks, contract
      # validation — is pure and renderer-free, so it runs in CI without a GPU.
      # These are the regressions that actually hurt: a player tunnelling
      # through a wall, or the lift opening its doors mid-shaft.
      - name: Test
        run: npm test
      - name: Verify authored game assets
        run: npm run verify:assets
      - name: Verify production asset manifest
        run: npm run verify:production-manifest
      - name: Audit production scene
        run: npm run audit:production-scene
      - name: Build
        run: npm run build
      - name: Verify standalone boundary
        run: npm run verify:standalone
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
