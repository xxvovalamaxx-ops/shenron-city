name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Vite 8 requires Node 20.19+; 22 is the current LTS.
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      # The simulation — lift, doors, collision, shaft interlocks, contract
      # validation — is pure and renderer-free, so it runs in CI without a GPU.
      # These are the regressions that actually hurt: a player tunnelling
      # through a wall, or the lift opening its doors mid-shaft.
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify standalone boundary
        run: npm run verify:standalone
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
